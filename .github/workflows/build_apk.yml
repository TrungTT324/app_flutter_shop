name: build_apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/jollyshop.keystore

      - name: Create key.properties
        run: |
          echo "storeFile=jollyshop.keystore"                      > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"   >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"                 >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"           >> android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BUILD_DATE=$(date +'%Y%m%d-%H%M')
          APK_NAME="jollyshop-${VERSION}-${BUILD_DATE}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${APK_NAME}
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}"   >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: "v${{ env.VERSION }} Build #${{ github.run_number }}"
          body: |
            ## JollyShop — Release APK

            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`

            ### Cài đặt
            1. Tải file APK bên dưới
            2. Bật **Cài đặt từ nguồn không rõ** trên Android
            3. Mở file APK để cài
          files: build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          prerelease: false
